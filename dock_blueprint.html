<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XeroKratos — One-Piece Hologram Dock Blueprint & Live Rig</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #000000; color: #00f0ff; font-family: 'Courier New', monospace; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; position: relative; }

    /* Optical Mirror Flip for Arcade-Hood 45° Geometry:
       Hinge is at bottom of screen -> reflects to bottom of glass (Feet).
       Top of screen -> reflects to top of glass (Head).
       Only Horizontal Flip (scaleX(-1)) needed so text & left/right hands match! */
    body.holo-projection #canvas-container canvas {
      transform: scaleX(-1);
    }

    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 100;
      background: rgba(0, 12, 20, 0.9); border: 1px solid #00f0ff;
      padding: 12px 16px; border-radius: 6px; max-width: 410px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
      transition: opacity 0.3s;
    }
    body.holo-projection #hud { opacity: 0.1; }
    body.holo-projection #hud:hover { opacity: 0.95; }

    h1 { font-size: 14px; letter-spacing: 1px; margin-bottom: 6px; color: #fff; }
    .sub { font-size: 11px; color: #7ce8ff; margin-bottom: 8px; line-height: 1.4; }
    .slider-box {
      background: #001a26; border: 1px solid #00ff9d; padding: 8px;
      border-radius: 4px; margin-bottom: 10px;
    }
    .slider-box label { font-size: 11px; color: #00ff9d; font-weight: bold; display: block; margin-bottom: 4px; }
    input[type=range] { width: 100%; cursor: pointer; accent-color: #00ff9d; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button {
      background: #001a26; color: #00f0ff; border: 1px solid #00f0ff;
      padding: 6px 10px; font-family: inherit; font-size: 11px;
      cursor: pointer; border-radius: 3px; transition: 0.15s;
    }
    button:hover, button.active { background: #00f0ff; color: #000; font-weight: bold; }
    .mode-btn { width: 100%; padding: 8px; font-size: 12px; margin-bottom: 6px; border-color: #ffaa00; color: #ffaa00; }
    .mode-btn.active { background: #ffaa00; color: #000; }
    #telemetry { font-size: 10px; color: #00ff9d; margin-top: 6px; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>XEROKRATOS // ONE-PIECE DOCK BUILDER</h1>
    <div class="sub" id="mode-desc">
      Drag the green slider below to see how the 4 cardboard pieces + 1 clear sheet glue into ONE removable box that drops onto your 180° screen!
    </div>

    <div class="slider-box" id="explode-panel">
      <label for="explodeRange">EXPLODE / ASSEMBLE BOX PARTS: <span id="explodeVal">0% (Glued & Placed)</span></label>
      <input type="range" id="explodeRange" min="0" max="100" value="0" oninput="updateExplode(this.value)" />
      <div class="btn-row" style="margin-top:6px; margin-bottom:0;">
        <button onclick="animateExplode(100)">Explode Parts (See Cut List)</button>
        <button onclick="animateExplode(0)">Glue & Drop on Laptop</button>
      </div>
    </div>

    <button class="mode-btn active" id="btn-viz" onclick="setMode('visualizer')">
      [1] 3D BOX ASSEMBLY & SETUP VISUALIZER
    </button>
    <button class="mode-btn" id="btn-live" onclick="setMode('projection')">
      [2] LIVE HOLOGRAM PROJECTION (Put Box on Screen)
    </button>

    <div class="sub" style="margin-top:6px; margin-bottom:4px;">D3 KINEMATIC ANGLE PRESETS:</div>
    <div class="btn-row">
      <button onclick="setPose('neutral')">Neutral Idle</button>
      <button onclick="setPose('hand_up')">Hand Up (Ack)</button>
      <button onclick="setPose('finger_up')">Finger Up (Insight)</button>
      <button onclick="setPose('summon_term')">Summon Terminal</button>
      <button onclick="setPose('self_heal')">Spoilt-Context Heal</button>
    </div>

    <div class="btn-row">
      <button onclick="triggerSimSpeech()">Simulate TTS + D3 Speech</button>
      <button onclick="enableMic()">Bind Live Mic Lip/Beat Sync</button>
    </div>
    <div id="telemetry">STATUS: Ready | Drag slider to inspect each cardboard piece!</div>
  </div>

  <div id="canvas-container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a10);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.6, 3.8, 5.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.9, -0.4);
    controls.enableDamping = true;

    // Helper to make 3D Floating Text Labels on Cardboard Parts
    function makeLabel(text, subtext, color = '#00ff9d') {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 15, 25, 0.85)';
      ctx.fillRect(0, 0, 512, 128);
      ctx.strokeStyle = color; ctx.lineWidth = 4;
      ctx.strokeRect(4, 4, 504, 120);
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Courier New';
      ctx.fillText(text, 20, 50);
      ctx.fillStyle = color; ctx.font = '20px Courier New';
      ctx.fillText(subtext, 20, 92);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(1.5, 0.38, 1);
      return sprite;
    }

    // --- HOLOGRAM FRESNEL RIM SHADER ---
    function createHoloMaterial(hexColor = 0x00f0ff, opacity = 0.92) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(hexColor) },
          uTime: { value: 0 },
          uOpacity: { value: opacity }
        },
        vertexShader: `
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying vec3 vWorldPos;
          void main() {
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform float uTime;
          uniform float uOpacity;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          varying vec3 vWorldPos;
          void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float fresnel = pow(1.0 - abs(dot(normal, viewDir)), 2.2);
            float scanline = 0.85 + 0.15 * sin(vWorldPos.y * 55.0 - uTime * 8.0);
            vec3 col = uColor * (0.35 + 1.4 * fresnel) * scanline;
            gl_FragColor = vec4(col, clamp((0.28 + fresnel * 0.85) * uOpacity, 0.0, 1.0));
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
    }

    // --- BUILD ARTICULATED XEROKRATOS RIG ---
    function buildXeroKratosRig(opacity = 0.95) {
      const root = new THREE.Group();
      const mat = createHoloMaterial(0x00f0ff, opacity);
      const coreMat = createHoloMaterial(0xffffff, opacity);
      const joints = {};
      const limbGeo = (rTop, rBot, len) => {
        const g = new THREE.CylinderGeometry(rTop, rBot, len, 12, 4, true);
        g.translate(0, len / 2, 0);
        return g;
      };

      const pelvis = new THREE.Group();
      pelvis.position.y = 0.82;
      root.add(pelvis);
      joints.pelvis = pelvis;

      const spine = new THREE.Group();
      pelvis.add(spine);
      joints.spine_01 = spine;

      const torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.15, 0.56, 10, 4, true), mat);
      torsoMesh.position.y = 0.28;
      spine.add(torsoMesh);

      const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 1), coreMat);
      core.position.set(0, 0.38, 0.11);
      spine.add(core);
      joints.core = core;

      const neck = new THREE.Group();
      neck.position.set(0, 0.58, 0);
      spine.add(neck);
      joints.neck = neck;

      const headMesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.15, 2), mat);
      headMesh.scale.set(0.85, 1.15, 0.95);
      headMesh.position.y = 0.16;
      neck.add(headMesh);

      const visor = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.032, 0.08), coreMat);
      visor.position.set(0, 0.18, 0.11);
      neck.add(visor);

      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.022, 0.08), coreMat);
      jaw.position.set(0, 0.10, 0.11);
      neck.add(jaw);
      joints.jaw = jaw;

      ['L', 'R'].forEach(side => {
        const s = side === 'L' ? 1 : -1;
        const upperArm = new THREE.Group();
        upperArm.position.set(s * 0.25, 0.50, 0);
        spine.add(upperArm);
        joints[`upper_arm_${side}`] = upperArm;
        upperArm.add(new THREE.Mesh(limbGeo(0.05, 0.04, 0.28), mat));

        const lowerArm = new THREE.Group();
        lowerArm.position.set(0, 0.28, 0);
        upperArm.add(lowerArm);
        joints[`lower_arm_${side}`] = lowerArm;
        lowerArm.add(new THREE.Mesh(limbGeo(0.04, 0.03, 0.26), mat));

        const hand = new THREE.Group();
        hand.position.set(0, 0.26, 0);
        lowerArm.add(hand);
        joints[`hand_${side}`] = hand;
        const hMesh = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.07, 0.022), mat);
        hMesh.position.y = 0.035;
        hand.add(hMesh);

        const indexFinger = new THREE.Group();
        indexFinger.position.set(s * -0.018, 0.07, 0);
        hand.add(indexFinger);
        joints[`index_${side}`] = indexFinger;
        indexFinger.add(new THREE.Mesh(limbGeo(0.009, 0.007, 0.065), coreMat));

        const otherFingers = new THREE.Group();
        otherFingers.position.set(s * 0.014, 0.07, 0);
        hand.add(otherFingers);
        joints[`fingers_${side}`] = otherFingers;
        otherFingers.add(new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.06, 0.014), mat));
      });

      ['L', 'R'].forEach(side => {
        const s = side === 'L' ? 1 : -1;
        const leg = new THREE.Mesh(limbGeo(0.068, 0.04, 0.80), mat);
        leg.position.set(s * 0.10, 0.80, 0);
        leg.rotation.z = Math.PI;
        pelvis.add(leg);
      });

      const termGroup = new THREE.Group();
      termGroup.position.set(0.50, 1.25, 0.20);
      termGroup.rotation.y = -0.35;
      termGroup.add(new THREE.Mesh(
        new THREE.PlaneGeometry(0.42, 0.26),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff, wireframe: true, transparent: true, opacity: 0.65 })
      ));
      termGroup.visible = false;
      root.add(termGroup);
      joints.terminal = termGroup;

      return { root, joints, mat, coreMat };
    }

    // --- PHYSICAL LAPTOP + ONE-PIECE REMOVABLE DOCK BUILDER ---
    const physicalRigGroup = new THREE.Group();
    scene.add(physicalRigGroup);

    // 1. Laptop Keyboard Half (Towards User: z = 0 to +2.2)
    const kbBase = new THREE.Mesh(
      new THREE.BoxGeometry(3.45, 0.08, 2.2),
      new THREE.MeshStandardMaterial({ color: 0x222630, roughness: 0.6 })
    );
    kbBase.position.set(0, -0.04, 1.1);
    physicalRigGroup.add(kbBase);
    const kbLabel = makeLabel("LAPTOP KEYBOARD", "You sit on this side", "#7ce8ff");
    kbLabel.position.set(0, 0.25, 1.6);
    physicalRigGroup.add(kbLabel);

    // 2. Laptop 180° Flat Screen Half (Away from User: z = 0 to -2.0)
    const screenBase = new THREE.Mesh(
      new THREE.BoxGeometry(3.45, 0.06, 2.0),
      new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.2 })
    );
    screenBase.position.set(0, -0.03, -1.0);
    physicalRigGroup.add(screenBase);

    // --- ONE-PIECE REMOVABLE HOLOGRAM DOCK (5 PARTS THAT GLUE TOGETHER) ---
    const dockGroup = new THREE.Group();
    physicalRigGroup.add(dockGroup);

    const cardboardMat = new THREE.MeshStandardMaterial({
      color: 0x0c0e12, roughness: 0.9, side: THREE.DoubleSide
    });
    const edgeTapeMat = new THREE.LineBasicMaterial({ color: 0xffaa00 });

    // PART 1: Back Vertical Wall (34cm x 20cm) standing at back of screen (z = -1.95)
    const backWallGroup = new THREE.Group();
    const backWallGeo = new THREE.BoxGeometry(3.4, 1.95, 0.04);
    const backWallMesh = new THREE.Mesh(backWallGeo, cardboardMat);
    backWallMesh.position.set(0, 0.975, -1.95);
    backWallGroup.add(backWallMesh);
    backWallGroup.add(new THREE.LineSegments(new THREE.EdgesGeometry(backWallGeo), edgeTapeMat).translateY(0.975).translateZ(-1.95));
    const lblBack = makeLabel("PIECE 1: BACK WALL", "34x20cm Black Cardboard (90°)", "#ffaa00");
    lblBack.position.set(0, 2.2, -1.95);
    backWallGroup.add(lblBack);
    dockGroup.add(backWallGroup);

    // PART 2 & 3: Left & Right 45° Cardboard Side Triangles (20cm base x 20cm tall)
    // Correct Arcade Hood Geometry: Hinge (z=0, y=0) -> Back Top (z=-1.95, y=1.95) -> Back Bottom (z=-1.95, y=0)
    const triShape = new THREE.Shape();
    triShape.moveTo(0, 0);          // Bottom Front (Touches Laptop Hinge)
    triShape.lineTo(-1.95, 0);      // Bottom Back (Touches Back of Screen)
    triShape.lineTo(-1.95, 1.95);   // Top Back (Meets Top of Back Wall)
    triShape.closePath();           // 45° Slanted Front Edge (28.3cm)
    const triGeo = new THREE.ExtrudeGeometry(triShape, { depth: 0.03, bevelEnabled: false });

    const leftWallGroup = new THREE.Group();
    const leftMesh = new THREE.Mesh(triGeo, cardboardMat);
    leftMesh.rotation.y = -Math.PI / 2;
    leftMesh.position.set(-1.68, 0, 0);
    leftWallGroup.add(leftMesh);
    const lblLeft = makeLabel("PIECE 2: LEFT TRIANGLE", "20x20x28.3cm Cardboard", "#ffaa00");
    lblLeft.position.set(-2.3, 1.1, -1.0);
    leftWallGroup.add(lblLeft);
    dockGroup.add(leftWallGroup);

    const rightWallGroup = new THREE.Group();
    const rightMesh = new THREE.Mesh(triGeo, cardboardMat);
    rightMesh.rotation.y = -Math.PI / 2;
    rightMesh.position.set(1.71, 0, 0);
    rightWallGroup.add(rightMesh);
    const lblRight = makeLabel("PIECE 3: RIGHT TRIANGLE", "20x20x28.3cm Cardboard", "#ffaa00");
    lblRight.position.set(2.3, 1.1, -1.0);
    rightWallGroup.add(lblRight);
    dockGroup.add(rightWallGroup);

    // PART 4 & 5: 45° Slanted Front Window Frame + Clear Glass/PVC Sheet
    // Slants from Hinge (z=0, y=0) UP and BACK to (z=-1.95, y=1.95)
    const frontWindowGroup = new THREE.Group();
    frontWindowGroup.position.set(0, 0.975, -0.975);
    frontWindowGroup.rotation.x = -Math.PI / 4; // Leans back away from user at 45°!

    // Clear Glass / PVC Sheet
    const glassGeo = new THREE.PlaneGeometry(3.35, 2.75);
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x00f0ff, transparent: true, opacity: 0.24,
      roughness: 0.05, side: THREE.DoubleSide
    });
    const glassMesh = new THREE.Mesh(glassGeo, glassMat);
    frontWindowGroup.add(glassMesh);

    // 2cm Cardboard Window Border Frame around the Clear Sheet
    const frameBorder = new THREE.LineSegments(
      new THREE.EdgesGeometry(new THREE.BoxGeometry(3.4, 2.76, 0.04)),
      new THREE.LineBasicMaterial({ color: 0x00f0ff })
    );
    frontWindowGroup.add(frameBorder);

    const lblGlass = makeLabel("PIECE 4 & 5: 45° CLEAR SHEET", "Glued into Cardboard Window Frame", "#00f0ff");
    lblGlass.position.set(0, 0.4, 0.35);
    frontWindowGroup.add(lblGlass);
    dockGroup.add(frontWindowGroup);

    // Optical Ray Bounce Lines (Screen Pixel -> Bounces off Underside of 45° Glass -> Into User's Eyes)
    const rayMat = new THREE.LineDashedMaterial({ color: 0x00ff9d, dashSize: 0.08, gapSize: 0.05 });
    [-0.45, 0.45].forEach(x => {
      const pts = [
        new THREE.Vector3(x, 0.02, -0.95), // 1. Light leaves Flat 180° Screen UPWARD
        new THREE.Vector3(x, 0.95, -0.95), // 2. Hits Underside of 45° Glass Sheet
        new THREE.Vector3(x, 0.95, 2.3)    // 3. Reflects HORIZONTALLY into User's Eyes!
      ];
      const rayLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), rayMat);
      rayLine.computeLineDistances();
      physicalRigGroup.add(rayLine);
    });

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
    dirLight.position.set(4, 7, 5);
    physicalRigGroup.add(dirLight);
    physicalRigGroup.add(new THREE.AmbientLight(0x507090, 1.2));

    // --- EXPLODE / ASSEMBLE SLIDER LOGIC ---
    window.updateExplode = (val) => {
      const f = parseFloat(val) / 100.0;
      document.getElementById('explodeVal').innerText =
        f === 0 ? "0% (Glued & Placed on Screen)" : `${Math.round(val)}% (Exploded Cut View)`;

      // Lift entire dock slightly + separate the 4 sides so user sees how they glue together
      backWallGroup.position.set(0, f * 0.8, -f * 1.3);
      leftWallGroup.position.set(-f * 1.4, f * 0.5, 0);
      rightWallGroup.position.set(f * 1.4, f * 0.5, 0);
      frontWindowGroup.position.set(0, 0.975 + f * 1.4, -0.975 + f * 1.1);
    };

    window.animateExplode = (targetVal) => {
      const slider = document.getElementById('explodeRange');
      let cur = parseFloat(slider.value);
      const step = () => {
        cur += (targetVal - cur) * 0.15;
        if (Math.abs(targetVal - cur) < 0.5) cur = targetVal;
        slider.value = cur;
        updateExplode(cur);
        if (cur !== targetVal) requestAnimationFrame(step);
      };
      step();
    };

    // --- CREATE UPRIGHT VIRTUAL HOLOGRAM + FLAT SCREEN IMAGE ---
    const mainHolo = buildXeroKratosRig(0.95);
    mainHolo.root.position.set(0, 0.05, -1.15); // Standing upright inside the black cave
    scene.add(mainHolo.root);

    // Flat image rendered on the 180° laptop screen (Feet towards hinge, Head towards back wall)
    const screenTwin = buildXeroKratosRig(0.5);
    screenTwin.root.position.set(0, 0.02, -0.15);
    screenTwin.root.rotation.x = -Math.PI / 2;
    physicalRigGroup.add(screenTwin.root);

    // --- D3 KINEMATIC ANGLE PRESETS & CRITICALLY DAMPED SPRING SOLVER ---
    const deg = THREE.MathUtils.degToRad;
    const POSES = {
      neutral: {
        spine_01: [2, 0, 0], neck: [-2, 0, 0],
        upper_arm_R: [8, 0, -165], lower_arm_R: [20, 0, 0], index_R: [0, 0, 0], fingers_R: [0, 0, 0],
        upper_arm_L: [8, 0, 165],  lower_arm_L: [20, 0, 0], index_L: [0, 0, 0], fingers_L: [0, 0, 0],
        terminal: false, color: 0x00f0ff
      },
      hand_up: {
        spine_01: [4, -8, 0], neck: [5, 10, 0],
        upper_arm_R: [45, -15, -45], lower_arm_R: [65, 0, 0], index_R: [0, 0, 0], fingers_R: [0, 0, 0],
        upper_arm_L: [10, 0, 160],   lower_arm_L: [25, 0, 0], index_L: [0, 0, 0], fingers_L: [0, 0, 0],
        terminal: false, color: 0x00f0ff
      },
      finger_up: {
        spine_01: [5, -10, 0], neck: [-6, 12, 4],
        upper_arm_R: [55, -20, -35], lower_arm_R: [85, 0, 0], index_R: [0, 0, 0], fingers_R: [85, 0, 0],
        upper_arm_L: [12, 0, 155],   lower_arm_L: [35, 0, 0], index_L: [0, 0, 0], fingers_L: [0, 0, 0],
        terminal: false, color: 0x00ffaa
      },
      summon_term: {
        spine_01: [6, 14, 0], neck: [8, -18, 0],
        upper_arm_R: [15, 0, -150], lower_arm_R: [40, 0, 0], index_R: [0, 0, 0], fingers_R: [0, 0, 0],
        upper_arm_L: [65, 20, 40],  lower_arm_L: [45, 0, 0], index_L: [-15, 0, 0], fingers_L: [10, 0, 0],
        terminal: true, color: 0x00f0ff
      },
      self_heal: {
        spine_01: [14, 0, 0], neck: [18, 0, -6],
        upper_arm_R: [60, -25, -55], lower_arm_R: [75, 0, 0], index_R: [25, 0, 0], fingers_R: [70, 0, 0],
        upper_arm_L: [60, 25, 55],   lower_arm_L: [75, 0, 0], index_L: [25, 0, 0], fingers_L: [70, 0, 0],
        terminal: true, color: 0xff9900
      }
    };

    const springState = {};
    Object.keys(POSES.neutral).forEach(k => {
      if (Array.isArray(POSES.neutral[k])) {
        springState[k] = {
          pos: POSES.neutral[k].map(deg),
          vel: [0, 0, 0],
          target: POSES.neutral[k].map(deg)
        };
      }
    });

    window.setPose = (poseName) => {
      const p = POSES[poseName];
      if (!p) return;
      Object.keys(p).forEach(k => {
        if (Array.isArray(p[k]) && springState[k]) {
          springState[k].target = p[k].map(deg);
        }
      });
      mainHolo.joints.terminal.visible = p.terminal;
      screenTwin.joints.terminal.visible = p.terminal;
      mainHolo.mat.uniforms.uColor.value.setHex(p.color);
      document.getElementById('telemetry').innerText =
        `D3 ACTIVE POSE: [${poseName.toUpperCase()}] | Terminal Widget: ${p.terminal ? 'ON' : 'OFF'}`;
    };

    window.setMode = (mode) => {
      const isProj = mode === 'projection';
      document.body.classList.toggle('holo-projection', isProj);
      document.getElementById('btn-viz').classList.toggle('active', !isProj);
      document.getElementById('btn-live').classList.toggle('active', isProj);
      document.getElementById('explode-panel').style.display = isProj ? 'none' : 'block';

      physicalRigGroup.visible = !isProj;
      scene.background.setHex(isProj ? 0x000000 : 0x050a10);

      if (isProj) {
        mainHolo.root.position.set(0, 0, 0);
        camera.position.set(0, 0.95, 2.35);
        controls.target.set(0, 0.92, 0);
        document.getElementById('mode-desc').innerText =
          "LIVE PROJECTION ACTIVE: Fold laptop 180° flat, place your glued One-Piece Box over the screen, and turn room lights OFF.";
      } else {
        mainHolo.root.position.set(0, 0.05, -1.15);
        camera.position.set(5.6, 3.8, 5.6);
        controls.target.set(0, 0.9, -0.4);
        document.getElementById('mode-desc').innerText =
          "Drag the green slider below to see how the 4 cardboard pieces + 1 clear sheet glue into ONE removable box!";
      }
      controls.update();
    };

    let audioAnalyser = null, audioData = null, simSpeechEnd = 0;

    window.enableMic = async () => {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = new AudioContext();
      const src = ctx.createMediaStreamSource(stream);
      audioAnalyser = ctx.createAnalyser();
      audioAnalyser.fftSize = 256;
      src.connect(audioAnalyser);
      audioData = new Uint8Array(audioAnalyser.frequencyBinCount);
      document.getElementById('telemetry').innerText = "MIC BOUND: Speak to drive real-time Viseme Jaw + Forearm Beats!";
    };

    window.triggerSimSpeech = () => {
      const msg = "XeroKratos holographic dock locked. Spawning background worker and executing task.";
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(msg);
        u.pitch = 0.85; u.rate = 1.05;
        window.speechSynthesis.speak(u);
      }
      simSpeechEnd = performance.now() + 5200;
      setPose('hand_up');
      setTimeout(() => setPose('finger_up'), 1400);
      setTimeout(() => setPose('summon_term'), 2900);
      setTimeout(() => setPose('neutral'), 5200);
    };

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.getElapsedTime();

      mainHolo.mat.uniforms.uTime.value = t;
      screenTwin.mat.uniforms.uTime.value = t;

      let voiceEnergy = 0;
      if (audioAnalyser && audioData) {
        audioAnalyser.getByteFrequencyData(audioData);
        let sum = 0;
        for (let i = 2; i < 32; i++) sum += audioData[i];
        voiceEnergy = Math.min(1.0, (sum / 30) / 140);
      } else if (performance.now() < simSpeechEnd) {
        voiceEnergy = 0.35 + 0.45 * Math.abs(Math.sin(t * 14.0) * Math.cos(t * 5.3));
      }

      const omega = 11.0, zeta = 0.86;
      Object.keys(springState).forEach(jName => {
        const s = springState[jName];
        for (let a = 0; a < 3; a++) {
          let targetAngle = s.target[a];
          if (jName === 'spine_01' && a === 0) targetAngle += Math.sin(t * 1.8) * 0.035;
          if (jName.startsWith('lower_arm') && a === 0) targetAngle += voiceEnergy * 0.28 * Math.sin(t * 12.0);
          if (jName === 'neck' && a === 0) targetAngle += voiceEnergy * 0.14;

          const accel = -2.0 * zeta * omega * s.vel[a] - (omega * omega) * (s.pos[a] - targetAngle);
          s.vel[a] += accel * dt;
          s.pos[a] += s.vel[a] * dt;
        }
        [mainHolo.joints[jName], screenTwin.joints[jName]].forEach(j => {
          if (j) j.rotation.set(s.pos[0], s.pos[1], s.pos[2]);
        });
      });

      const jawY = 0.10 - voiceEnergy * 0.035;
      mainHolo.joints.jaw.position.y = jawY;
      screenTwin.joints.jaw.position.y = jawY;
      mainHolo.joints.core.rotation.y = t * 2.2;
      mainHolo.joints.core.scale.setScalar(1.0 + voiceEnergy * 0.35);

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
