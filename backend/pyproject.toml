[project]
name = "xerohologram-backend"
version = "1.0.0"
description = "Ultra-low-latency Async Multiplexer Daemon for XeroHoloGram"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "edge-tts>=6.1.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
